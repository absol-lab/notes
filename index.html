/* ---------- header + sync (bizplan pattern) ---------- */
header.top{

#syncbar{ display:block; width:100%; background:none; border:none; text-align:center; font-size:13px; color:var(--muted); padding:2px 16px 6px; min-height:1.2em; letter-spacing:.03em; font-family:inherit; cursor:pointer; }

main{ padding:2px 16px 0; max-width:640px; margin:0 auto; }

.counters{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 16px; display:flex; align-items:center; gap:10px; }
.counters .big{ font-size:17px; font-weight:700; white-space:nowrap; }
.counters .goal{ margin-left:auto; text-align:right; font-size:13px; color:var(--muted); line-height:1.5; }
.counters .goal b{ color:var(--text); font-size:15px; }
/* ---------- filter pills (diary todo .tdfpill pattern) ---------- */
.tdfolders{ display:flex; gap:8px; overflow-x:auto; padding:14px 2px 8px; scrollbar-width:none; }
.tdfolders::-webkit-scrollbar{ display:none; }
.tdfpill{ flex:0 0 auto; padding:8px 15px; border-radius:999px; border:none; background:var(--card); color:var(--muted); font-size:15px; font-weight:600; font-family:var(--uifont); cursor:pointer; }
.tdfpill.on{ background:var(--text); color:var(--bg); }
.tdfpill .tdcnt{ opacity:.65; font-weight:500; margin-left:3px; }

.axishead{ display:flex; align-items:baseline; gap:8px; margin:20px 4px 2px; }
.axishead .an{ font-size:15px; font-weight:700; }
.axishead .ac{ font-size:12.5px; color:var(--muted); }
@keyframes cdIn{ from{opacity:.3; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

.tdrow{ display:flex; align-items:center; gap:12px; padding:7px 4px; min-height:52px; background:var(--bg); position:relative; cursor:pointer; }
.tdrow::after{ content:''; position:absolute; left:45px; right:0; bottom:0; height:1px; background:var(--line); }
.axisgroup .tdrow:last-child::after{ display:none; }
.tdcheck{ flex:0 0 auto; width:29px; height:29px; border-radius:50%; border:2px solid var(--muted); color:var(--bg); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; background:transparent; cursor:pointer; }
.tdcheck.done{ background:var(--text); border-color:var(--text); }
.tdmain{ flex:1; min-width:0; }
.tdtitle{ font-size:16.5px; line-height:1.45; }
.tddel{ flex:0 0 auto; width:38px; height:38px; border:none; background:none; color:var(--muted); font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:.55; }
.tdnone{ color:var(--muted); text-align:center; padding:52px 0; font-size:14px; }

.groupcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 14px 12px; margin-bottom:14px; }

#tdquick .qascrim{ position:absolute; inset:0; }
.qacard{ position:absolute; left:10px; right:10px; bottom:10px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:14px 14px 12px; box-shadow:0 18px 50px rgba(0,0,0,.35); transform:translateY(115%); transition:transform .34s cubic-bezier(.32,.72,.28,1); font-family:var(--uifont); }

.qainput{ width:100%; box-sizing:border-box; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:13px 14px; font-size:16px; color:var(--text); font-family:var(--uifont); outline:none; margin-top:10px; }

.qarow2{ display:flex; align-items:flex-start; gap:10px; margin-bottom:2px; }
.qalab{ font-size:13px; color:var(--muted); flex:0 0 auto; padding-top:8px; }
.qalistchips{ display:flex; gap:6px; flex-wrap:wrap; }

.qarow{ display:flex; align-items:center; gap:10px; margin-top:14px; }

function reducedMotion(){ try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
var toastTimer = null;
function toast(msg){
  var t = $('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------- data ---------- */
var DATA = loadCache();
function loadCache(){
  try{
    var c = JSON.parse(localStorage.getItem(LS_CACHE) || 'null');
    if(c && Array.isArray(c.items)) return c;
  }catch(e){}
  return clone(SEED);
}
var SAVE_FAIL = false;
function saveCache(){
  try{ localStorage.setItem(LS_CACHE, JSON.stringify(DATA)); SAVE_FAIL = false; }
  catch(e){ SAVE_FAIL = true; }
}
function itemById(id){
  for(var i = 0; i < DATA.items.length; i++) if(DATA.items[i].id === id) return DATA.items[i];
  return null;
}
function visibleItems(){ return DATA.items.filter(function(it){ return !it.deleted; }); }
function axesInOrder(){
  var seen = {}, out = [];
  DATA.items.forEach(function(it){ if(!seen[it.axis]){ seen[it.axis] = true; out.push(it.axis); } });
  return out;
}

/* ---------- last-landed stamps (honest unsynced count) ---------- */
var LS_STAMPS = 'notes.knownStamps';
function stampsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_STAMPS) || 'null'); }catch(e){ return null; } }
function stampsSave(data){
  var m = {};
  (data.items || []).forEach(function(it){ m[it.id] = it.updated_at || ''; });
  try{ localStorage.setItem(LS_STAMPS, JSON.stringify(m)); }catch(e){}
}
function dirtyCount(){
  var st = stampsLoad();
  if(!st) return DATA.items.length;
  var n = 0;
  DATA.items.forEach(function(it){ if(st[it.id] !== (it.updated_at || '')) n++; });
  return n;
}

/* ---------- rendering ---------- */
var filterMode = 'all'; /* all | adopted | unadopted */
var qaAxis = null;      /* quick-add: selected axis ('__new__' = new axis) */
function counts(){
  var vis = visibleItems();
  var ad = 0;
  vis.forEach(function(it){ if(it.adopted) ad++; });
  return { total: vis.length, adopted: ad };
}
function renderCounters(){
  var c = counts();
  var rest = Math.max(0, GOAL_TOTAL - c.adopted);
  $('counters').innerHTML =
    '<span class="big">採用 ' + c.adopted + '本 / 全' + c.total + '本</span>' +
    '<span class="goal">目標' + GOAL_TOTAL + '本まで<br>残り <b>' + rest + '本</b></span>';
}
function renderFilters(){
  var c = counts();
  var un = c.total - c.adopted;
  var defs = [
    { k: 'all', label: 'すべて', n: c.total },
    { k: 'adopted', label: '採用のみ', n: c.adopted },
    { k: 'unadopted', label: '未選択のみ', n: un }
  ];
  $('filters').innerHTML = defs.map(function(d){
    return '<button type="button" class="tdfpill' + (filterMode === d.k ? ' on' : '') + '" data-filter="' + d.k + '">' + d.label + '<span class="tdcnt">' + d.n + '</span></button>';
  }).join('');
}
function renderList(anim){
  var wrap = $('listwrap');
  var vis = visibleItems().filter(function(it){
    if(filterMode === 'adopted') return it.adopted;
    if(filterMode === 'unadopted') return !it.adopted;
    return true;
  });
  if(!vis.length){
    wrap.innerHTML = '<div class="tdnone">表示するタイトルがありません</div>';
    return;
  }
  var byAxis = {}, order = [];
  vis.forEach(function(it){
    if(!byAxis[it.axis]){ byAxis[it.axis] = []; order.push(it.axis); }
    byAxis[it.axis].push(it);
  });
  var allByAxis = {};
  visibleItems().forEach(function(it){
    if(!allByAxis[it.axis]) allByAxis[it.axis] = { total: 0, adopted: 0 };
    allByAxis[it.axis].total++;
    if(it.adopted) allByAxis[it.axis].adopted++;
  });
  wrap.innerHTML = order.map(function(axis){
    var st = allByAxis[axis] || { total: 0, adopted: 0 };
    var h = '<div class="axisgroup"><div class="axishead"><span class="an">' + esc(axis) + '</span><span class="ac">採用' + st.adopted + '／全' + st.total + '</span></div>';
    h += byAxis[axis].map(function(it){
      return '<div class="tdrow" data-id="' + esc(it.id) + '">' +
        '<button type="button" class="tdcheck' + (it.adopted ? ' done' : '') + '" aria-label="採用チェック">' + (it.adopted ? '✓' : '') + '</button>' +
        '<div class="tdmain"><div class="tdtitle">' + esc(it.title) + '</div></div>' +
        '<button type="button" class="tddel" data-del="' + esc(it.id) + '" aria-label="削除">×</button>' +
      '</div>';
    }).join('');
    return h + '</div>';
  }).join('');
  wrap.classList.toggle('anim', !!anim);
}
function renderAll(anim){
  renderCounters();
  renderFilters();
  renderList(anim);
  renderSyncStatus();
}

/* ---------- mutations ---------- */
var syncDebounce = null;
function touched(){
  saveCache();
  pendingCount = dirtyCount();
  renderAll(false);
  if(syncDebounce) clearTimeout(syncDebounce);
  syncDebounce = setTimeout(function(){ appSync(false); }, 1600);
}
function toggleItem(id){
  var it = itemById(id); if(!it || it.deleted) return;
  it.adopted = !it.adopted;
  it.updated_at = nowISO();
  touched();
}
function deleteItem(id){
  var it = itemById(id); if(!it || it.deleted) return;
  it.deleted = true;
  it.updated_at = nowISO();
  touched();
  toast('削除しました');
}
function addItem(axis, title){
  var id = 't' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  DATA.items.push({ id: id, axis: axis, title: title, adopted: false, updated_at: nowISO(), deleted: false });
  touched();
}
$('listwrap').addEventListener('click', function(e){
  var del = e.target.closest ? e.target.closest('[data-del]') : null;
  if(del){ e.stopPropagation(); deleteItem(del.getAttribute('data-del')); return; }
  var row = e.target.closest ? e.target.closest('.tdrow') : null;
  if(row) toggleItem(row.getAttribute('data-id'));
});
$('filters').addEventListener('click', function(e){
  var p = e.target.closest ? e.target.closest('[data-filter]') : null;
  if(!p) return;
  filterMode = p.getAttribute('data-filter');
  renderFilters();
  renderList(true);
});

/* ---------- fetch with timeout (bizplan pattern) ---------- */
function fetchT(url, opts, ms){
  return new Promise(function(resolve, reject){
    var ctl = null;
    try{ ctl = new AbortController(); }catch(e){}
    var to = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} reject(new Error('通信がタイムアウトしました')); }, ms || 30000);
    var o = Object.assign({}, opts || {}); if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(function(r){ clearTimeout(to); resolve(r); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function syncHashOfStr(s){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i = 0; i < s.length; i++){ var ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return s.length + ':' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function sleepMs(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------- relay transport (the zukan/bizplan app's, ported) ----------
   The relay spec is frozen (ping/stat/get/put + a filename
   pattern); titles.json matches the pattern, so the relay works
   for this app with NO relay-side change. The config lives in
   this app's own key. When it is absent, the zukan app's
   same-origin config is adopted read-only. The secret is never
   embedded in this file. */
var LS_RELAY = 'notes.relay';
var RELAY_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfgInfo(){
  var own = null;
  try{ own = JSON.parse(localStorage.getItem(LS_RELAY) || 'null'); }catch(e){}
  if(own && own.disabled) return null;
  if(own && own.secret) return { url: own.url || RELAY_URL_DEFAULT, secret: own.secret, adopted: false };
  try{
    var z = JSON.parse(localStorage.getItem('zukan.relay') || 'null');
    if(z && z.secret) return { url: z.url || RELAY_URL_DEFAULT, secret: z.secret, adopted: true };
  }catch(e){}
  return null;
}
function relayCfg(){ var i = relayCfgInfo(); return i ? { url: i.url, secret: i.secret } : null; }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content, extra){
  var c = relayCfg(); if(!c) throw new Error('中継が未設定です');
  var body = JSON.stringify(Object.assign({ secret: c.secret, op: op, name: name, content: content }, extra || {}));
  var healed = false;
  for(;;){
    var res = await fetchT(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }, 60000);
    if(!res.ok) throw new Error('中継 HTTP ' + res.status);
    var text = await res.text();
    var ctype = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : '';
    var trimmed = text.replace(/^\s+/, '');
    var sentinel = trimmed.indexOf('Muse relay is alive') === 0 || (/^text\/plain/i.test(ctype) && trimmed.charAt(0) !== '{');
    if(sentinel && !healed){ healed = true; continue; }
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if(!j || typeof j !== 'object' || typeof j.ok === 'undefined'){
      var err = new Error('中継の応答が正しく届きませんでした');
      err.code = 'RELAY_BAD_BODY';
      throw err;
    }
    if(!j.ok) throw new Error('中継エラー：' + ((j && j.error) || 'unknown'));
    return j;
  }
}
function relaySave(url, secret){
  url = String(url || '').trim() || RELAY_URL_DEFAULT; secret = String(secret || '').trim();
  if(!secret){ toast('シークレットを入力してください'); return false; }
  try{ localStorage.setItem(LS_RELAY, JSON.stringify({ url: url, secret: secret })); }catch(e){}
  renderSyncStatus();
  return true;
}
function relayForget(){
  var info = relayCfgInfo();
  try{
    if(info && !info.adopted) localStorage.removeItem(LS_RELAY);
    else localStorage.setItem(LS_RELAY, JSON.stringify({ disabled: true }));
  }catch(e){}
  renderSyncStatus();
  toast('この端末では中継を使わない設定にしました');
}
async function relaySaveAndTest(){
  var u = $('relayUrl'), s = $('relaySecret'), st = $('relayStat');
  if(!u || !s) return;
  if(!relaySave(u.value, s.value)) return;
  if(st) st.textContent = '接続テスト中…';
  try{
    await relayCall('ping');
    if(st) st.textContent = '接続OK — この端末では Google ログインなしで同期します。';
    appSync(false);
  }catch(e){
    if(st) st.textContent = '接続に失敗しました：' + ((e && e.message) || e);
  }
}
function relayGroupHTML(){
  var rc = relayCfgInfo();
  var h = '<div class="groupcard">';
  h += '<div class="srow"><span class="lb">中継（ログインなし同期）</span><span class="val">' + (rc ? (rc.adopted ? '図鑑と共有中' : '設定済み') : '未設定') + '</span></div>';
  if(rc){
    h += '<div class="rstat">' + (rc.adopted ? '図鑑アプリで設定した中継を、この端末ではそのまま使っています。Googleログインなしで同期します。' : 'この端末では Google ログインなしで同期します。') + '</div>';
    h += '<button class="rbtn" onclick="relayForget()">この端末では中継を使わない</button>';
  } else {
    h += '<input class="rinput" id="relayUrl" type="text" placeholder="https://script.google.com/macros/s/…" autocomplete="off" value="' + esc(RELAY_URL_DEFAULT) + '">';
    h += '<input class="rinput" id="relaySecret" type="password" placeholder="シークレット" autocomplete="off">';
    h += '<button class="rbtn" onclick="relaySaveAndTest()">保存してテスト</button>';
    h += '<div class="rstat" id="relayStat">中継を設定すると、Google ログインなしで同期できます（図鑑アプリと同じ仕組み）。</div>';
  }
  h += '</div>';
  return h;
}

var syncRunning = false, syncError = null, lastSyncAt = 0, pendingCount = dirtyCount();
var syncNote = '';

function renderSettings(){

function onDriveRow(){
  if(relayReady()){ appSync(true); return; }
  if(isConnected()){ disconnectDrive(); toast('Driveの接続を解除しました'); }
  else connectDrive();
}
function renderSyncStatus(){
  var html;
  if(syncRunning) html = '同期中…';
  else if(syncError) html = '<span class="err">同期エラー</span> ・ 未同期' + pendingCount + '件 ・ <span class="sbhint">タップで再試行</span>';
  else if(!isConnected() && !relayReady()) html = 'Drive未接続（端末内のデータを表示中） ・ <span class="sbhint">タップで接続</span>';
  else if(pendingCount > 0) html = '未同期の変更' + pendingCount + '件 ・ <span class="sbhint">タップで同期</span>';
  else if(lastSyncAt){
    var d = new Date(lastSyncAt);
    html = '同期済み（' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '）';
  }
  else if(relayReady()) html = '中継の準備OK ・ <span class="sbhint">タップで同期</span>';
  else html = '接続済み ・ <span class="sbhint">タップで同期</span>';
  if(syncNote && !syncRunning && !syncError) html += ' ・ ' + esc(syncNote);
  $('syncbar').innerHTML = html;
  var dv = $('driveval'); if(dv) dv.textContent = driveValText();
  /* never rebuild the settings under the user's fingers while
     they are typing the relay secret */
  var sec = $('relaySecret');
  if(!(sec && (sec.value || document.activeElement === sec))) renderSettings();
  $('syncdot').style.background = (!syncError && (relayReady() || (isConnected() && !!accessToken))) ? '#46a758' : '#e5484d';
}
$('syncbar').addEventListener('click', function(){
  if(syncRunning) return;
  if(relayReady()){ appSync(true); return; }
  if(!isConnected() || (syncError && !accessToken)){ connectDrive(); return; }
  appSync(true);
});

/* ---------- GIS token (popup only — never a redirect on iOS) --- */
function waitGis(){
  return new Promise(function(res, rej){
    var n = 0;
    var iv = setInterval(function(){
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(iv); res(); }
      else if(++n > 40){ clearInterval(iv); rej(new Error('gis-timeout')); }
    }, 250);
  });
}
function storeToken(tok, expiresInSec){
  accessToken = tok;
  tokenExp = Date.now() + (expiresInSec ? expiresInSec * 1000 : 3000000);
  try{ sessionStorage.setItem('notes.token', tok); sessionStorage.setItem('notes.tokenExp', String(tokenExp)); }catch(e){}
}
function tokenFromSession(){
  if(accessToken && Date.now() < tokenExp - 30000) return accessToken;
  try{
    var t = sessionStorage.getItem('notes.token'), x = Number(sessionStorage.getItem('notes.tokenExp') || 0);
    if(t && Date.now() < x - 30000){ accessToken = t; tokenExp = x; return t; }
  }catch(e){}
  return null;
}
function clearToken(){
  accessToken = null; tokenExp = 0;
  try{ sessionStorage.removeItem('notes.token'); sessionStorage.removeItem('notes.tokenExp'); }catch(e){}
}
function requestToken(interactive){
  return new Promise(function(res, rej){
    waitGis().then(function(){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: function(resp){
          if(resp && resp.access_token){ storeToken(resp.access_token, resp.expires_in); res(accessToken); }
          else rej(new Error('no-token'));
        },
        error_callback: function(err){ rej(new Error(err && err.type ? err.type : 'gis-error')); }
      });
      /* an explicit connect ALWAYS shows the account chooser —
         he holds two Google accounts */
      tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
    }).catch(rej);
  });
}
function getValidToken(interactive){
  var t = tokenFromSession();
  if(t) return Promise.resolve(t);
  return requestToken(interactive);
}
var silentTryAt = 0;
function trySilentReconnect(){
  if(!isConnected() || relayReady()) return;
  if(tokenFromSession()) return;
  var now = Date.now();
  if(now - silentTryAt < 60000) return;
  silentTryAt = now;
  requestToken(false).then(function(){ appSync(false); }).catch(function(){});
}
function connectDrive(){
  getValidToken(true).then(function(){
    setConnected(true); syncError = null;
    renderSyncStatus();
    appSync(true);
  }).catch(function(){
    syncError = 'connect';
    renderSyncStatus();
  });
}
function disconnectDrive(){
  clearToken(); fileId = null;
  setConnected(false); syncError = null;
  renderSyncStatus();
}

/* ---------- Drive (GIS) primitives ---------- */
function driveFetch(url, opts){
  return getValidToken(false).then(function(token){
    var headers = Object.assign({}, (opts && opts.headers) || {}, { 'Authorization': 'Bearer ' + token });
    return fetchT(url, Object.assign({}, opts || {}, { headers: headers }), 60000);
  }).then(function(res){
    if(res.status === 401){ clearToken(); throw new Error('auth-401'); }
    if(!res.ok) throw new Error('drive-' + res.status);
    return res;
  });
}
function ensureFileId(){
  if(fileId) return Promise.resolve(fileId);
  var q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive')
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j.files && j.files.length){ fileId = j.files[0].id; return fileId; }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
      }).then(function(cres){ return cres.json(); }).then(function(cj){
        fileId = cj.id;
        return uploadData(DATA).then(function(){ return fileId; });
      });
    });
}
function remoteStampGIS(){
  return ensureFileId().then(function(id){
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=modifiedTime');
  }).then(function(res){ return res.json(); }).then(function(j){ return j && j.modifiedTime ? String(j.modifiedTime) : null; });
}
function normalizeData(j){
  if(!j || !Array.isArray(j.items)) return null;
  return j;
}
function downloadData(){
  return ensureFileId()
    .then(function(id){ return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media'); })
    .then(function(res){ return res.text(); })
    .then(function(text){
      if(!text || !text.trim()) return null;
      return normalizeData(JSON.parse(text));
    });
}
function uploadData(data){
  return ensureFileId().then(function(id){
    var payload = clone(data);
    payload.updatedAt = nowISO();
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  });
}

/* ---------- merge (the zukan/bizplan app's rules, item shape) ----------
   Per item id the newer updated_at wins wholesale. Convergence:
   a local-only item whose id was in the last landed server set
   is treated as deleted on the server and dropped (deletions
   propagate); a local-only item the server set has never
   contained is kept and counted pending. Deletions made here
   ride as tombstone records (deleted:true) with a fresh
   updated_at, so they win merges on other devices. */
function mergeData(local, remote){
  if(!remote) return { data: local, changed: false, pending: local.items.length, dropped: 0 };
  var known = knownIdsLoad();
  var remoteById = {};
  remote.items.forEach(function(it){ remoteById[it.id] = it; });
  var seen = {}, mergedItems = [], pending = 0, dropped = 0;
  local.items.forEach(function(li){
    seen[li.id] = true;
    var ri = remoteById[li.id];
    if(!ri){
      if(known && known.indexOf(li.id) >= 0){ dropped++; return; }
      mergedItems.push(li); pending++;
    }
    else if((li.updated_at || '') > (ri.updated_at || '')){ mergedItems.push(li); pending++; }
    else mergedItems.push(ri);
  });
  remote.items.forEach(function(ri){ if(!seen[ri.id]) mergedItems.push(ri); });
  var merged = { version: 1, updatedAt: local.updatedAt, items: mergedItems };
  return { data: merged, changed: JSON.stringify(merged) !== JSON.stringify(local), pending: pending, dropped: dropped };
}

/* ---------- sync core (the zukan/bizplan app's rules) ---------- */
var syncQueue = Promise.resolve();
function queueSync(task){
  var p = syncQueue.then(task, task);
  syncQueue = p.then(function(){}, function(){});
  return p;
}
function isTimeoutErr(e){
  var m = String((e && e.message) || e || '');
  return /タイムアウト|abort|network|failed to fetch/i.test(m) || (e && e.code === 'RELAY_BAD_BODY');
}
function appSync(manual){
  return queueSync(function(){ return syncFlow(manual); });
}
async function syncFlow(manual){
  if(!relayReady() && !isConnected()){ if(manual) connectDrive(); return; }
  syncRunning = true; syncError = null; renderSyncStatus();
  try{
    await syncOnce();
  }catch(e1){
    if(isTimeoutErr(e1)){
      await sleepMs(1500);
      try{ await syncOnce(); }
      catch(e2){ syncError = String((e2 && e2.message) || e2); appendSyncLine('同期', '失敗しました：' + syncError, true); }
    } else {
      syncError = String((e1 && e1.message) || e1);
      appendSyncLine('同期', '失敗しました：' + syncError, true);
    }
  }
  syncRunning = false;
  pendingCount = dirtyCount();
  renderSyncStatus();
}
async function syncOnce(){
  syncNote = '';
  if(relayReady()) await syncViaRelay();
  else await syncViaGIS();
  lastSyncAt = Date.now();
}
function adoptMerged(m){
  if(m.changed){
    DATA = m.data; saveCache(); renderAll(false);
  }
  pendingCount = m.pending;
}
function guardTripped(m, remote){ return m.data.items.length < remote.items.length; }
async function syncViaRelay(){
  var st = await relayCall('stat', FILE_NAME);
  var meta = syncMetaLoad();
  if(st.exists && meta && String(meta.stamp) === String(st.updated) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0;
    return;
  }
  if(!st.exists){
    var seedPayload = clone(DATA); seedPayload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(seedPayload));
    DATA.updatedAt = seedPayload.updatedAt; saveCache();
    var st2 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st2.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    appendSyncLine('同期', '中継で titles.json を作成しました');
    return;
  }
  var g = await relayCall('get', FILE_NAME);
  var remote = null;
  try{ remote = normalizeData(JSON.parse(g.content)); }catch(e){}
  if(!remote) throw new Error('サーバのデータを読み取れませんでした');
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.items.map(function(it){ return it.id; }));
    stampsSave(DATA);
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, items: remote.items });
  if(remoteChanged || m.pending > 0){
    var payload = clone(m.data); payload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(payload));
    DATA.updatedAt = payload.updatedAt; saveCache();
    pendingCount = 0;
    stampsSave(DATA);
    var st3 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st3.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  } else {
    stampsSave(DATA);
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  }
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました（中継）');
}
async function syncViaGIS(){
  var meta = syncMetaLoad();
  var stamp = null;
  try{ stamp = await remoteStampGIS(); }catch(e){ stamp = null; }
  if(stamp && meta && String(meta.stamp) === String(stamp) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0;
    return;
  }
  var remote = await downloadData();
  if(!remote){
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    return;
  }
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.items.map(function(it){ return it.id; }));
    stampsSave(DATA);
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, items: remote.items });
  if(remoteChanged || m.pending > 0){
    await uploadData(m.data);
    pendingCount = 0;
    DATA.updatedAt = nowISO(); saveCache();
    stampsSave(DATA);
  } else {
    stampsSave(DATA);
  }
  var stamp2 = null;
  try{ stamp2 = await remoteStampGIS(); }catch(e){}
  syncMetaSave({ stamp: stamp2 ? String(stamp2) : null, hash: syncHashOfStr(JSON.stringify(DATA)) });
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました');
}
setInterval(function(){
  if(syncRunning) return;
  trySilentReconnect();
}, 30000);
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  if(relayReady()){ appSync(false); return; }
  if(isConnected()){
    if(tokenFromSession()) appSync(false);
    else trySilentReconnect();
  }
});

/* ---------- boot ---------- */
var vb = $('verBadge'); if(vb) vb.textContent = 'v' + APP_VERSION;
renderAll(true);
renderSyncStatus();
(function(){
  var v = $('veil');
  if(!v) return;
  var done = false;
  function kill(){ if(done) return; done = true; try{ v.remove(); }catch(e){} }
  v.addEventListener('click', kill);
  if(reducedMotion()){ kill(); return; }
  setTimeout(kill, 900);
})();
if(relayReady()){ appSync(false); }
else if(isConnected()){
  if(tokenFromSession()) appSync(false);
  else trySilentReconnect();
}
</script>
